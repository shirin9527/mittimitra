<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MittiMitra</title>
<meta name="theme-color" content="#278342">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
body {
font-family: Arial, sans-serif;
background: #eef7e8;
margin: 0;
padding: 20px;
}

.container {
max-width: 450px;
margin: auto;
background: white;
padding: 22px;
border-radius: 16px;
box-shadow: 0 4px 12px #0002;
}

h1 {
color: #24713b;
text-align: center;
}

p {
text-align: center;
color: #526b52;
}

label {
display: block;
margin-top: 14px;
font-weight: bold;
}

input, select {
width: 100%;
box-sizing: border-box;
padding: 11px;
margin-top: 6px;
border: 1px solid #b8cdb5;
border-radius: 8px;
}

button {
width: 100%;
margin-top: 20px;
padding: 13px;
background: #278342;
color: white;
border: none;
border-radius: 8px;
font-size: 16px;
cursor: pointer;
}

#result {
margin-top: 18px;
padding: 12px;
border-radius: 8px;
line-height: 1.6;
}
</style>
</head>
<body>
<div class="container">
  <h1>🌱 MittiMitra</h1>
  <p>Smart Soil Testing & Crop Recommendation</p><label for="nitrogen">Nitrogen (N)</label>
<input id="nitrogen" type="number" placeholder="Enter N value">

<label for="phosphorus">Phosphorus (P)</label>
<input id="phosphorus" type="number" placeholder="Enter P value">

<label for="potassium">Potassium (K)</label>
<input id="potassium" type="number" placeholder="Enter K value">

<label for="ph">Soil pH</label>
<input id="ph" type="number" step="0.1" placeholder="Enter pH">

<label for="moisture">Soil Moisture (%)</label>
<input id="moisture" type="number" placeholder="Enter moisture">

<label for="season">Season</label>
<select id="season">
<option value="kharif">Kharif (Monsoon)</option>
<option value="rabi">Rabi (Winter)</option>
</select>

<button onclick="recommendCrop()">Recommend Crop</button>

  <div id="result"></div>
</div>


<script>
const crops = [
  // name, season, N, P, K, pH, moisture
  { name: "Rice (Dhaan)",      season: "kharif", n: 80,  p: 48, k: 40, ph: 6.4, m: 80 },
  { name: "Maize (Makka)",     season: "kharif", n: 78,  p: 48, k: 20, ph: 6.2, m: 65 },
  { name: "Cotton (Kapas)",    season: "kharif", n: 118, p: 46, k: 20, ph: 6.9, m: 80 },
  { name: "Soybean",           season: "kharif", n: 25,  p: 60, k: 40, ph: 6.5, m: 60 },
  { name: "Bajra",             season: "kharif", n: 60,  p: 30, k: 30, ph: 7.0, m: 40 },
  { name: "Moong (Green gram)",season: "kharif", n: 20,  p: 45, k: 20, ph: 6.8, m: 45 },
  { name: "Wheat (Gehu)",      season: "rabi",   n: 100, p: 50, k: 40, ph: 6.8, m: 50 },
  { name: "Chickpea (Chana)",  season: "rabi",   n: 40,  p: 68, k: 80, ph: 7.0, m: 30 },
  { name: "Mustard (Sarson)",  season: "rabi",   n: 80,  p: 40, k: 40, ph: 6.8, m: 35 },
  { name: "Lentil (Masoor)",   season: "rabi",   n: 20,  p: 60, k: 20, ph: 6.8, m: 35 },
  { name: "Barley (Jau)",      season: "rabi",   n: 70,  p: 40, k: 30, ph: 7.0, m: 40 }
];

function recommendCrop() {
  const ids = ["nitrogen", "phosphorus", "potassium", "ph", "moisture"];
  const result = document.getElementById("result");

  if (ids.some(id => document.getElementById(id).value === "")) {
    result.innerHTML = "Please enter all soil values.";
    return;
  }

  const n = Number(document.getElementById("nitrogen").value);
  const p = Number(document.getElementById("phosphorus").value);
  const k = Number(document.getElementById("potassium").value);
  const ph = Number(document.getElementById("ph").value);
  const moisture = Number(document.getElementById("moisture").value);
  const season = document.getElementById("season").value;

  if (ph < 0 || ph > 14 || moisture < 0 || moisture > 100 || n < 0 || p < 0 || k < 0) {
    result.innerHTML = "Please check your values.";
    return;
  }

  // Normalize so that N (big numbers) doesn't dominate pH (small numbers)
  const dist = c =>
    Math.pow((n - c.n) / 140, 2) +
    Math.pow((p - c.p) / 145, 2) +
    Math.pow((k - c.k) / 205, 2) +
    Math.pow((ph - c.ph) / 14, 2) * 4 +
    Math.pow((moisture - c.m) / 100, 2);

  const ranked = crops
    .filter(c => c.season === season)
    .map(c => ({ ...c, d: dist(c) }))
    .sort((a, b) => a.d - b.d)
    .slice(0, 3);

  let advice = ph < 5.5 ? "Soil is acidic. Get a soil laboratory recommendation."
             : ph > 8.5 ? "Soil is alkaline. Get a soil laboratory recommendation."
             : "pH is within a broad range suitable for many crops.";

  result.innerHTML =
    "<h3>🌱 MittiMitra Soil Report</h3>" +
    "<p>N: " + n + " | P: " + p + " | K: " + k + "</p>" +
    "<p>Soil pH: " + ph + " | Moisture: " + moisture + "%</p>" +
    "<p>" + advice + "</p>" +
    "<h3>✅ Recommended: " + ranked[0].name + "</h3>" +
    "<p>Other options: " + ranked[1].name + ", " + ranked[2].name + "</p>" +
    "<p><b>Note:</b> Ye ek approximate suggestion hai. Final decision se pehle local soil test ya krishi expert se confirm karein.</p>";
}
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
